<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Фон с лёгким скруглением -->
  <rect width="64" height="64" rx="14" fill="#f5f0e8"/>

  <!-- Внешнее кольцо -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#1e3a5f" stroke-width="3"/>

  <!-- Левая половина — "Тогда" (сепия) -->
  <path d="M32 8 A24 24 0 0 0 32 56 Z" fill="#c9a66b"/>

  <!-- Правая половина — "Сейчас" (синий) -->
  <path d="M32 8 A24 24 0 0 1 32 56 Z" fill="#2e86c1"/>

  <!-- Центральная ось -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#f5f0e8" stroke-width="1.5" opacity="0.7"/>

  <!-- Стрелки часов -->
  <circle cx="32" cy="32" r="3" fill="#1e3a5f"/>
  <line x1="32" y1="32" x2="32" y2="19" stroke="#1e3a5f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="41" y2="37" stroke="#1e3a5f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Метки часов -->
  <circle cx="32" cy="14" r="1.3" fill="#1e3a5f"/>
  <circle cx="32" cy="50" r="1.3" fill="#1e3a5f"/>
  <circle cx="14" cy="32" r="1.3" fill="#1e3a5f"/>
  <circle cx="50" cy="32" r="1.3" fill="#1e3a5f"/>
</svg>